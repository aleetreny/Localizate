name: Refresh Opportunity Listings Monthly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 1 * *"
      timezone: "Europe/Madrid"

permissions:
  contents: write

concurrency:
  group: refresh-opportunities-monthly
  cancel-in-progress: false

jobs:
  refresh-opportunities:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_BROWSER_RUN_API_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_RUN_API_TOKEN }}
      R2_SYNC_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_SYNC_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SYNC_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_SYNC_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_DATA_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: back/requirements-opportunity-weekly.txt

      - name: Restore geocode cache
        id: geocode-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: storage/data/intermediate/manual_available_locales_madrid_geocode_cache.csv
          key: manual-available-locales-geocode-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            manual-available-locales-geocode-${{ runner.os }}-

      - name: Install monthly refresh dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r back/requirements-opportunity-weekly.txt

      - name: Validate required refresh and publish configuration
        run: |
          missing=()
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -n "$CLOUDFLARE_BROWSER_RUN_API_TOKEN" ] || missing+=("CLOUDFLARE_BROWSER_RUN_API_TOKEN")
          [ -n "$R2_SYNC_ACCESS_KEY_ID" ] || missing+=("R2_ACCESS_KEY_ID")
          [ -n "$R2_SYNC_SECRET_ACCESS_KEY" ] || missing+=("R2_SECRET_ACCESS_KEY")
          [ -n "$R2_SYNC_BUCKET_NAME" ] || missing+=("R2_BUCKET_NAME")
          [ -n "$R2_PUBLIC_BASE_URL" ] || missing+=("NEXT_PUBLIC_DATA_BASE_URL")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required refresh configuration: ${missing[*]}"
            exit 1
          fi

      - name: Install R2 sync dependency
        run: python -m pip install boto3

      - name: Refresh snapshot with Cloudflare Browser Run
        run: |
          python back/scripts/refresh_opportunity_listings_cloudflare.py \
            --max-pages 30 \
            --max-browser-requests 40 \
            --min-browser-interval-seconds 15 \
            --max-browser-ms-per-run 360000 \
            --max-new-geocodes 250 \
            --max-removed-listings 100 \
            --max-removal-ratio 0.25 \
            --geocode-delay-seconds 1.2

      - name: Report refresh outcome
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary_path = Path("storage/data/processed/manual_available_locales_madrid_refresh_summary.json")
          if not summary_path.exists():
              message = f"Refresh summary missing: {summary_path}"
              print(f"::error::{message}")
              raise SystemExit(message)

          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          status = summary.get("status", "unknown")
          reason = summary.get("reason")
          attempts = summary.get("attempts") or []
          print(f"Refresh status: {status}")
          if attempts:
              for attempt in attempts:
                  transport = attempt.get("transport", "unknown")
                  attempt_status = attempt.get("status", "unknown")
                  attempt_reason = attempt.get("reason")
                  if attempt_reason:
                      print(f"- {transport}: {attempt_status} ({attempt_reason})")
                  else:
                      print(f"- {transport}: {attempt_status}")
          if status != "updated":
              message = reason or "Opportunity refresh completed without a new crawl result."
              print(f"::error::{message}")
              raise SystemExit(message)
          PY

      - name: Rebuild frontend listings payload
        run: |
          python back/scripts/build_frontend_opportunity_listings.py \
            --input-listings-csv back/data/opportunities/manual_available_locales_madrid_snapshot.csv

      - name: Validate frontend payload
        run: python back/scripts/validate_opportunity_refresh_outputs.py

      - name: Detect opportunity refresh changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- back/data/opportunities/manual_available_locales_madrid_snapshot.csv back/data/opportunities/last_successful_refresh.json front/public/data/opportunities/listings.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save geocode cache
        if: success() && hashFiles('storage/data/intermediate/manual_available_locales_madrid_geocode_cache.csv') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: storage/data/intermediate/manual_available_locales_madrid_geocode_cache.csv
          key: ${{ steps.geocode-cache.outputs.cache-primary-key }}

      - name: Commit and push opportunity refresh
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add back/data/opportunities/manual_available_locales_madrid_snapshot.csv
          git add back/data/opportunities/last_successful_refresh.json
          git add front/public/data/opportunities/listings.json
          git commit -m "chore: refresh opportunity listings"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Publish refreshed opportunity data to R2
        env:
          R2_ACCOUNT_ID: ${{ env.R2_SYNC_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ env.R2_SYNC_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ env.R2_SYNC_SECRET_ACCESS_KEY }}
        run: |
          python back/scripts/sync_public_data_to_r2.py \
            --source front/public/data/opportunities \
            --bucket "$R2_SYNC_BUCKET_NAME" \
            --prefix "data/opportunities" \
            --cache-control "public, max-age=0, s-maxage=300, stale-while-revalidate=3600" \
            --delete-missing

      - name: Verify published opportunity payload
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import time

          import requests

          local_path = Path("front/public/data/opportunities/listings.json")
          expected_sha256 = hashlib.sha256(local_path.read_bytes()).hexdigest()
          public_base = os.environ["R2_PUBLIC_BASE_URL"].rstrip("/")
          run_id = os.environ["GITHUB_RUN_ID"]
          url = f"{public_base}/data/opportunities/listings.json?refresh_run={run_id}"

          last_error = None
          for attempt in range(1, 6):
              try:
                  response = requests.get(url, timeout=60)
                  response.raise_for_status()
                  published_sha256 = hashlib.sha256(response.content).hexdigest()
                  if published_sha256 == expected_sha256:
                      print(f"Verified published listings.json on attempt {attempt}: {published_sha256}")
                      break
                  last_error = RuntimeError(
                      f"Published SHA-256 {published_sha256} does not match local {expected_sha256}."
                  )
              except Exception as exc:
                  last_error = exc
              if attempt < 5:
                  time.sleep(5)
          else:
              message = f"R2 publication verification failed: {last_error}"
              print(f"::error::{message}")
              raise SystemExit(message)
          PY
